server {
    listen 80;
    server_name osm.texodus.tech;

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:5000;
        proxy_redirect off;
    }

    location /static {
        alias /home/ubuntu/geospatial-tagging-thesis/web_app/static;
        expires 30d;
    }

    # Serve reports directly if needed, or through Flask static route
    location /reports {
        alias /home/ubuntu/geospatial-tagging-thesis/reports;
        autoindex on;
    }
}
