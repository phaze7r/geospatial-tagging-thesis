server {
    server_name osm.texodus.tech;

    # 1. Main App (Passes traffic to Gunicorn via Socket)
    location / {
        include proxy_params;
        # FIX: Point to the socket file we defined in the systemd service
        proxy_pass http://unix:/home/ubuntu/geospatial-tagging-thesis/osm_thesis.sock;
    }

    # 2. Static Files (CSS/JS/Images)
    location /static {
        alias /home/ubuntu/geospatial-tagging-thesis/web_app/static;
        expires 30d;
    }

    # 3. Reports (Optional - ensure this folder exists!)
    # I changed the alias to point to 'datareported' based on your repo list.
    # If you actually created a 'reports' folder manually, change it back.
    location /reports {
        alias /home/ubuntu/geospatial-tagging-thesis/datareported; 
        autoindex on;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/osm.texodus.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/osm.texodus.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = osm.texodus.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name osm.texodus.tech;
    return 404; # managed by Certbot


}